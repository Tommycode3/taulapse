name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          taulapse simulate --model ddm --n 300 --out sim.csv
          taulapse fit sim.csv --out rep --n-surr 20
          test -f rep/params.csv
