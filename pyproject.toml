[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taulapse"
version = "0.1.0"
description = "Ex-Gaussian, drift-diffusion and spectral models of reaction-time variability, with parameter/model recovery as the verifier."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tommaso Maggiolo", email = "maggiolotommaso@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
crosscheck = ["pyddm>=0.8"]

[project.scripts]
taulapse = "taulapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
